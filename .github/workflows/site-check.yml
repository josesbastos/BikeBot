name: Site connectivity check
on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner to test
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u site_probe.py
